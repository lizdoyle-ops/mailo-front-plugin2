services:
  - type: web
    name: mailo-front-plugin
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: FRONT_API_TOKEN
        sync: false
      - key: FRONT_INBOX_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONT_CLIENT_ID
        sync: false
      - key: FRONT_CLIENT_SECRET
        sync: false
      - key: FRONT_OAUTH_URL
        sync: false
      - key: FRONT_WEBHOOK_SECRET
        sync: false
      - key: NODE_ENV
        value: production
